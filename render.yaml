services:
  - type: web
    name: prep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://prep-frontend-tenq.onrender.com

  - type: web
    name: prep-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://prep-prototype.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html